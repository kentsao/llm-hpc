[project]
name = "llm-hpc"
version = "0.1.0"
description = "A hands-on curriculum in high-performance computing for large language models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "torch>=2.3",
    "matplotlib>=3.8",
    "numba>=0.59",
    "psutil>=5.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["chapters"]
addopts = "-q"
timeout = 300
markers = [
    "perf: performance-threshold tests (skipped on CI; run locally)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
